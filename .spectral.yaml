extends:
  - spectral:oas
  - spectral:asyncapi
rules:
  asyncapi-info-license: off
  # 2.6 is deliberate until microcks/microcks#2273 is fixed — see docs/decisions.md
  asyncapi-latest-version: off
overrides:
  # the 'invalid' request example is deliberately schema-invalid: it documents
  # (and lets the Microcks contract test replay) the 400 path
  - files:
      - "specs/openapi.yaml#/paths/~1commands~1make-pizza/post/requestBody/content/application~1json/examples/invalid"
    rules:
      oas3-valid-media-example: off
