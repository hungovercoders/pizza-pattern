# Installed into the implementation repo by the implement-pizza-service skill
# (phase 5). Receives contract-changed dispatches from the contract repo and
# converges the implementation on the new contract ref via an agent PR.
name: contract-sync
on:
  repository_dispatch:
    types: [contract-changed]
  workflow_dispatch:
    inputs:
      contract_ref:
        description: pizza-pattern commit sha to sync to
        required: true

concurrency:
  group: contract-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard - already at the target ref?
        id: target
        env:
          REF: ${{ github.event.client_payload.contract_ref || github.event.inputs.contract_ref }}
        run: |
          current=$(cat CONTRACT_REF)
          echo "target=$REF implemented=$current"
          if [ "$REF" = "$current" ]; then
            echo "already implemented - nothing to sync"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@v2
        if: steps.target.outputs.skip == 'false'
      - uses: anthropics/claude-code-action@v1
        if: steps.target.outputs.skip == 'false'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools Bash,Edit,Write,Read,Glob,Grep"
          prompt: |
            The pizza-pattern contract has changed. Converge this implementation
            on the new ref - update, never regenerate.

            Target contract ref: ${{ steps.target.outputs.ref }}
            Currently implemented ref: the sha in CONTRACT_REF.

            1. Clone https://github.com/hungovercoders/pizza-pattern twice - at
               the CONTRACT_REF sha and at the target ref - and diff specs/
               (openapi, asyncapi, features) between them. Scope every change
               you make to that diff; leave everything the diff does not touch
               alone.
            2. Follow the process in the contract repo's
               skills/implement-pizza-service/SKILL.md (skip the interview -
               those choices are already made in this codebase) and the
               definition of done in its docs/implementing.md.
            3. Update this implementation minimally until `task ci` passes
               against the target ref, and set CONTRACT_REF to the target sha.
            4. Commit (conventional message), push branch
               contract-sync/<first 8 chars of the target sha> - force-push if
               it exists, re-runs converge on one branch - and create a PR to
               main with gh, or leave the existing PR for that branch (your
               push already updated it).
            5. If `task ci` cannot be made green, still push and open/update
               the PR as a draft stating exactly which checks fail and why.
               Never weaken tests, the contract clone, or CONTRACT_REF to
               force a green result.
