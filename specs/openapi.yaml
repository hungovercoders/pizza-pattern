openapi: 3.1.0
info:
  title: Pizza Service API
  version: 1.0.0
  description: |
    Command-driven pizza making service. Consumers POST a `MakePizza` command
    (not a pizza — the pizza does not exist yet). The service accepts the
    command and fulfils it asynchronously; fulfilment mechanics are an internal
    concern and are deliberately absent from this contract. Progress is
    observable via `GET /pizzas/{pizzaId}` and via the events described in
    `asyncapi.yaml`.
  contact:
    name: hungovercoders
    url: https://github.com/hungovercoders/pizza-pattern
servers:
  - url: http://localhost:8585/rest/Pizza+Service+API/1.0.0
    description: Microcks mock (see README quickstart)
tags:
  - name: commands
    description: Commands accepted by the service
  - name: pizzas
    description: Read-only pizza status projections
paths:
  /commands/make-pizza:
    post:
      operationId: makePizza
      tags: [commands]
      summary: Submit a MakePizza command
      description: |
        Accepts a command to make a pizza. Returns `202 Accepted` — the command
        has been validated and accepted for asynchronous fulfilment. Nothing
        the consumer owns exists yet, hence not `201`. Replaying the same
        `Idempotency-Key` returns the same response body (same `commandId` and
        `pizzaId`) rather than making a second pizza.
      x-microcks-operation:
        delay: 300
        triggers:
          - 'Pizza Lifecycle Events:1.0.0:SUBSCRIBE pizza/lifecycle'
        dispatcher: JSON_BODY
        dispatcherRules: |
          {
            "exp": "/size",
            "operator": "equals",
            "cases": {
              "small": "margherita",
              "medium": "margherita",
              "large": "margherita",
              "default": "invalid"
            }
          }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID; replays return the original result.
          schema:
            type: string
            format: uuid
          example: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakePizzaCommand"
            examples:
              margherita:
                summary: A medium sourdough margherita
                value:
                  size: medium
                  crust: sourdough
                  toppings: [mozzarella, basil]
      responses:
        "202":
          description: Command accepted for asynchronous fulfilment.
          headers:
            Location:
              description: Status URL for the pizza this command will produce.
              schema:
                type: string
                example: /pizzas/11111111-1111-1111-1111-111111111111
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
              examples:
                margherita:
                  value:
                    commandId: 22222222-2222-2222-2222-222222222222
                    pizzaId: 11111111-1111-1111-1111-111111111111
                    status: accepted
                    statusUrl: /pizzas/11111111-1111-1111-1111-111111111111
        "400":
          description: Command failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid:
                  value:
                    type: https://pizza-pattern.hungovercoders.com/problems/invalid-command
                    title: Invalid MakePizza command
                    status: 400
                    detail: "size must be one of: small, medium, large"
  /commands/cancel-pizza:
    post:
      operationId: cancelPizza
      tags: [commands]
      summary: Submit a CancelPizza command
      description: |
        Accepts a command to cancel a pizza that is not yet in a terminal
        state. Returns `202 Accepted` with a new `commandId` for the cancel
        command (same `pizzaId`). Cancelling a pizza that is already `ready`,
        `failed` or `cancelled` returns `409`.

        Mock behaviour: `pizzaId 11111111-…111` returns the 202 example; any
        other value returns the 409 example.
      x-microcks-operation:
        delay: 300
        dispatcher: JSON_BODY
        dispatcherRules: |
          {
            "exp": "/pizzaId",
            "operator": "equals",
            "cases": {
              "11111111-1111-1111-1111-111111111111": "cancelAccepted",
              "default": "notCancellable"
            }
          }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID; replays return the original result.
          schema:
            type: string
            format: uuid
          example: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelPizzaCommand"
            examples:
              cancelAccepted:
                summary: Cancel the canonical fixture pizza
                value:
                  pizzaId: 11111111-1111-1111-1111-111111111111
                  reason: Changed my mind
              notCancellable:
                summary: Cancel a pizza already in a terminal state
                value:
                  pizzaId: 11111111-1111-1111-1111-111111111115
                  reason: Too late
      responses:
        "202":
          description: Cancel command accepted for asynchronous fulfilment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
              examples:
                cancelAccepted:
                  value:
                    commandId: 22222222-2222-2222-2222-222222222229
                    pizzaId: 11111111-1111-1111-1111-111111111111
                    status: accepted
                    statusUrl: /pizzas/11111111-1111-1111-1111-111111111111
        "409":
          description: The pizza is already in a terminal state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notCancellable:
                  value:
                    type: https://pizza-pattern.hungovercoders.com/problems/pizza-not-cancellable
                    title: Pizza not cancellable
                    status: 409
                    detail: Pizza is already in a terminal state and cannot be cancelled
  /pizzas/{pizzaId}:
    get:
      operationId: getPizzaStatus
      tags: [pizzas]
      summary: Get the current status of a pizza
      description: |
        Read-only projection of the pizza's lifecycle, derived from the same
        events published on the `pizza/lifecycle` channel. After a `202` from
        `makePizza`, this endpoint immediately returns the pizza in state
        `accepted` — there is no 404 window. Any id that is not a known pizza
        returns the 404 problem response.
      x-microcks-operation:
        delay: 150
        dispatcher: FALLBACK
        dispatcherRules: |
          {
            "dispatcher": "URI_PARTS",
            "dispatcherRules": "pizzaId",
            "fallback": "notFound"
          }
      parameters:
        - name: pizzaId
          in: path
          required: true
          description: |
            The mock serves one fixture pizza frozen in each lifecycle state —
            use the id matching the state you want to exercise. The canonical
            id (`…111`) returns `accepted`, matching what the `makePizza`
            `statusUrl` points at immediately after a 202 (read-your-writes).
          schema:
            type: string
            format: uuid
          examples:
            accepted:
              value: 11111111-1111-1111-1111-111111111111
            topped:
              value: 11111111-1111-1111-1111-111111111112
            cooked:
              value: 11111111-1111-1111-1111-111111111113
            boxed:
              value: 11111111-1111-1111-1111-111111111114
            ready:
              value: 11111111-1111-1111-1111-111111111115
            failed:
              value: 11111111-1111-1111-1111-111111111116
            cancelled:
              value: 11111111-1111-1111-1111-111111111117
            notFound:
              value: 99999999-9999-9999-9999-999999999999
      responses:
        "200":
          description: Current pizza status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PizzaStatus"
              examples:
                accepted:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111111
                    commandId: 22222222-2222-2222-2222-222222222222
                    state: accepted
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:00:00Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                topped:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111112
                    commandId: 22222222-2222-2222-2222-222222222223
                    state: topped
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:00:05Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                      - state: topped
                        at: 2026-08-15T12:00:05Z
                cooked:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111113
                    commandId: 22222222-2222-2222-2222-222222222224
                    state: cooked
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:04:05Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                      - state: topped
                        at: 2026-08-15T12:00:05Z
                      - state: cooked
                        at: 2026-08-15T12:04:05Z
                boxed:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111114
                    commandId: 22222222-2222-2222-2222-222222222225
                    state: boxed
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:04:35Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                      - state: topped
                        at: 2026-08-15T12:00:05Z
                      - state: cooked
                        at: 2026-08-15T12:04:05Z
                      - state: boxed
                        at: 2026-08-15T12:04:35Z
                ready:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111115
                    commandId: 22222222-2222-2222-2222-222222222227
                    state: ready
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:05:00Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                      - state: topped
                        at: 2026-08-15T12:00:05Z
                      - state: cooked
                        at: 2026-08-15T12:04:05Z
                      - state: boxed
                        at: 2026-08-15T12:04:35Z
                      - state: ready
                        at: 2026-08-15T12:05:00Z
                failed:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111116
                    commandId: 22222222-2222-2222-2222-222222222226
                    state: failed
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:04:05Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                      - state: topped
                        at: 2026-08-15T12:00:05Z
                      - state: cooked
                        at: 2026-08-15T12:04:05Z
                      - state: failed
                        at: 2026-08-15T12:04:05Z
                cancelled:
                  value:
                    pizzaId: 11111111-1111-1111-1111-111111111117
                    commandId: 22222222-2222-2222-2222-222222222228
                    state: cancelled
                    order:
                      size: medium
                      crust: sourdough
                      toppings: [mozzarella, basil]
                    updatedAt: 2026-08-15T12:01:00Z
                    history:
                      - state: accepted
                        at: 2026-08-15T12:00:00Z
                      - state: cancelled
                        at: 2026-08-15T12:01:00Z
        "404":
          description: No pizza with this id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  value:
                    type: https://pizza-pattern.hungovercoders.com/problems/pizza-not-found
                    title: Pizza not found
                    status: 404
                    detail: No pizza exists with id 99999999-9999-9999-9999-999999999999
components:
  schemas:
    MakePizzaCommand:
      type: object
      required: [size, crust, toppings]
      additionalProperties: false
      properties:
        size:
          type: string
          enum: [small, medium, large]
        crust:
          type: string
          enum: [thin, deep-pan, sourdough]
        toppings:
          type: array
          maxItems: 8
          items:
            type: string
        notes:
          type: string
          description: Free-text instructions for the kitchen.
    CancelPizzaCommand:
      type: object
      required: [pizzaId]
      additionalProperties: false
      properties:
        pizzaId:
          type: string
          format: uuid
          description: The pizza to cancel.
        reason:
          type: string
    CommandAccepted:
      type: object
      required: [commandId, pizzaId, status, statusUrl]
      properties:
        commandId:
          type: string
          format: uuid
          description: Identity of the accepted command.
        pizzaId:
          type: string
          format: uuid
          description: Identity of the pizza this command will produce.
        status:
          type: string
          const: accepted
        statusUrl:
          type: string
          description: Relative URL to poll for pizza status.
    PizzaStatus:
      type: object
      required: [pizzaId, commandId, state, order, updatedAt, history]
      properties:
        pizzaId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/PizzaState"
        order:
          type: object
          required: [size, crust, toppings]
          properties:
            size:
              type: string
              enum: [small, medium, large]
            crust:
              type: string
              enum: [thin, deep-pan, sourdough]
            toppings:
              type: array
              items:
                type: string
        updatedAt:
          type: string
          format: date-time
        history:
          type: array
          description: States entered so far, oldest first — a projection of the event stream.
          items:
            type: object
            required: [state, at]
            properties:
              state:
                $ref: "#/components/schemas/PizzaState"
              at:
                type: string
                format: date-time
    PizzaState:
      type: string
      enum: [accepted, topped, cooked, boxed, ready, failed, cancelled]
      description: |
        Lifecycle state. `ready`, `failed` and `cancelled` are terminal. Each
        state is entered by exactly one event on the `pizza/lifecycle` channel.
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
