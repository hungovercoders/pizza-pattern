version: "3"

vars:
  MICROCKS_URL: http://localhost:8585
  REST_BASE: http://localhost:8585/rest/Pizza+Service+API/1.0.0
  WS_URL: ws://localhost:8081/api/ws/Pizza+Lifecycle+Events/1.0.0/pizza/lifecycle
  FIXTURE_PIZZA_ID: 11111111-1111-1111-1111-111111111111

tasks:
  docs:asyncapi:
    desc: Generate static AsyncAPI HTML into the docs source tree
    sources:
      - specs/asyncapi.yaml
    generates:
      - docs-src/api/asyncapi-html/index.html
    cmds:
      - npx -y @asyncapi/cli@5 generate fromTemplate specs/asyncapi.yaml @asyncapi/html-template@3.5.0 --output docs-src/api/asyncapi-html --force-write --param singleFile=true

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:asyncapi]
    cmds:
      - uvx --with-requirements requirements.docs.txt mkdocs build --strict

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:asyncapi]
    cmds:
      - uvx --with-requirements requirements.docs.txt mkdocs serve

  lint:
    desc: Lint OpenAPI and AsyncAPI specs with Spectral
    cmds:
      - npx -y @stoplight/spectral-cli lint specs/*.yaml --fail-severity=warn

  mocks:up:
    desc: Start the Microcks mock stack
    cmds:
      - docker compose -f mocks/docker-compose.yml up -d --wait

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - docker compose -f mocks/docker-compose.yml down

  mocks:load:
    desc: Load both specs into Microcks
    cmds:
      - curl -sf -F 'file=@specs/openapi.yaml' '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=true'
      - curl -sf -F 'file=@specs/asyncapi.yaml' '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=true'
      - curl -sf -F 'file=@mocks/pizza-lifecycle-events.examples.yaml' '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=false'
      - docker compose -f mocks/docker-compose.yml restart async-minion

  mocks:test:
    desc: Smoke-test the HTTP and event mocks
    cmds:
      - |
        code=$(curl -s -o /tmp/make-pizza.json -w '%{http_code}' -X POST {{.REST_BASE}}/commands/make-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"size":"medium","crust":"sourdough","toppings":["mozzarella","basil"]}')
        [ "$code" = "202" ] || { echo "expected 202, got $code"; exit 1; }
        jq -e .pizzaId /tmp/make-pizza.json
      - |
        state=$(curl -sf {{.REST_BASE}}/pizzas/{{.FIXTURE_PIZZA_ID}} | jq -r .state)
        [ "$state" = "accepted" ] || { echo "expected accepted, got $state"; exit 1; }
        echo "statusUrl after POST -> $state"
      - |
        for s in accepted:1 topped:2 cooked:3 boxed:4 ready:5 failed:6 cancelled:7; do
          want=${s%%:*}; id=11111111-1111-1111-1111-11111111111${s##*:}
          got=$(curl -sf {{.REST_BASE}}/pizzas/$id | jq -r .state)
          [ "$got" = "$want" ] || { echo "pizza $id: expected $want, got $got"; exit 1; }
          echo "$id -> $got"
        done
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' {{.REST_BASE}}/pizzas/$(uuidgen | tr 'A-Z' 'a-z'))
        [ "$code" = "404" ] || { echo "unknown id: expected 404, got $code"; exit 1; }
        echo "unknown id -> 404"
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST {{.REST_BASE}}/commands/cancel-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"pizzaId":"{{.FIXTURE_PIZZA_ID}}","reason":"smoke"}')
        [ "$code" = "202" ] || { echo "cancel: expected 202, got $code"; exit 1; }
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST {{.REST_BASE}}/commands/cancel-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"pizzaId":"11111111-1111-1111-1111-111111111115"}')
        [ "$code" = "409" ] || { echo "cancel terminal: expected 409, got $code"; exit 1; }
        echo "cancel -> 202 / terminal cancel -> 409"
      - |
        node -e "
        const marker = 'trigger-' + Math.random().toString(36).slice(2);
        const ws = new WebSocket('{{.WS_URL}}');
        ws.onopen = () => {
          fetch('{{.REST_BASE}}/commands/make-pizza', { method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': crypto.randomUUID() },
            body: JSON.stringify({ size: 'large', crust: 'thin', toppings: ['pepperoni', marker] }) });
        };
        ws.onmessage = e => {
          const ev = JSON.parse(e.data);
          if (ev.eventType === 'pizza.accepted.v1' && Array.isArray(ev.data.toppings) && ev.data.toppings.includes(marker)) {
            if (!ev.pizzaId.endsWith('111')) { console.error('triggered event has wrong pizzaId: ' + ev.pizzaId); process.exit(1); }
            if (ev.data.size !== 'large' || ev.data.crust !== 'thin') { console.error('request not echoed'); process.exit(1); }
            console.log('triggered event ok: echoed order on pizza ' + ev.pizzaId); process.exit(0);
          }
        };
        ws.onerror = () => { console.error('WS connection error'); process.exit(1); };
        setTimeout(() => { console.error('no triggered pizza.accepted.v1 with marker within 10s'); process.exit(1); }, 10000);
        "
      - |
        node -e "
        const ws = new WebSocket('{{.WS_URL}}');
        let sawFailed = false, count = 0;
        ws.onmessage = e => {
          const ev = JSON.parse(e.data); count++;
          if (ev.eventType === 'pizza.failed.v1') {
            sawFailed = true;
            if (!ev.pizzaId.endsWith('116')) { console.error('failed event on wrong pizza: ' + ev.pizzaId); process.exit(1); }
          }
          if (sawFailed && count >= 7) { console.log('events ok (' + count + ' received, failed on …116)'); process.exit(0); }
        };
        ws.onerror = () => { console.error('WS connection error'); process.exit(1); };
        setTimeout(() => { console.error('expected 7+ events incl. pizza.failed.v1 within 12s, got ' + count); process.exit(1); }, 12000);
        "
