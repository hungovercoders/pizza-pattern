version: "3"

vars:
  MICROCKS_URL: http://localhost:8585
  REST_BASE: http://localhost:8585/rest/Pizza+Service+API/1.0.0
  WS_URL: ws://localhost:8081/api/ws/Pizza+Lifecycle+Events/1.0.0/pizza/lifecycle
  FIXTURE_PIZZA_ID: 11111111-1111-1111-1111-111111111111
  # Contract tests are executed by Microcks itself, so the endpoints under test
  # are the in-network ones, not the localhost ports published to the host.
  REST_BASE_INTERNAL: http://microcks:8080/rest/Pizza+Service+API/1.0.0
  WS_URL_INTERNAL: ws://async-minion:8081/api/ws/Pizza+Lifecycle+Events/1.0.0/pizza/lifecycle

tasks:
  setup:
    desc: One-shot onboarding - install the pinned toolchain and git hooks
    cmds:
      - mise install
      - git config core.hooksPath .githooks

  check:
    desc: Fast checks (pre-commit tier) - branch name, spec lint, strict docs build
    cmds:
      - task: check:branch
      - task: lint
      - task: docs:build

  check:branch:
    desc: Branch name must be main or match the Linear convention (user/gri-123-slug)
    cmds:
      - |
        branch="${GITHUB_HEAD_REF:-$(git branch --show-current)}"
        if [ -z "$branch" ]; then echo "detached HEAD - skipping branch check"; exit 0; fi
        echo "$branch" | grep -qE '^main$|^[A-Za-z0-9._-]+/gri-[0-9]+(-[a-z0-9-]+)*$' \
          || { echo "branch '$branch' does not match Linear convention <user>/gri-<number>-<slug>"; exit 1; }
        echo "branch ok: $branch"

  check:commit:
    desc: Validate a single commit message file (commit-msg hook) against conventional commits
    cmds:
      - |
        head -1 "$MSG_FILE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' \
          || { echo "commit message is not a conventional commit (feat:, fix:, docs:, chore:, ...)"; exit 1; }

  check:commits:
    desc: Validate all commit messages ahead of origin/main against conventional commits
    cmds:
      - |
        if [ "$(git branch --show-current)" = "main" ] && [ -z "$GITHUB_HEAD_REF" ]; then echo "on main - skipping range check"; exit 0; fi
        git fetch -q origin main 2>/dev/null || true
        bad=$(git log origin/main..HEAD --format='%s' | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' || true)
        [ -z "$bad" ] || { echo "non-conventional commit messages:"; echo "$bad"; exit 1; }
        echo "commit messages ok ($(git log origin/main..HEAD --oneline | wc -l | tr -d ' ') checked)"

  ci:
    desc: Full verification - identical locally and in CI
    cmds:
      - defer: { task: mocks:down }
      - task: check
      - task: check:commits
      - task: mocks:load
      - task: mocks:contract
      - task: mocks:test

  docs:asyncapi:
    desc: Generate static AsyncAPI HTML into the docs source tree
    sources:
      - specs/asyncapi.yaml
    generates:
      - docs/api/asyncapi-html/index.html
    cmds:
      - npx -y @asyncapi/cli@5.0.7 generate fromTemplate specs/asyncapi.yaml @asyncapi/html-template@3.5.0 --output docs/api/asyncapi-html --force-write --param singleFile=true

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:asyncapi]
    cmds:
      - uvx --with-requirements requirements.docs.txt mkdocs build --strict

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:asyncapi]
    cmds:
      - uvx --with-requirements requirements.docs.txt mkdocs serve

  lint:
    desc: Lint OpenAPI and AsyncAPI specs with Spectral
    cmds:
      - npx -y @stoplight/spectral-cli@6.16.3 lint specs/*.yaml --fail-severity=warn

  mocks:up:
    desc: Start the Microcks mock stack
    run: once
    cmds:
      - docker compose -f mocks/docker-compose.yml up -d --wait

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - docker compose -f mocks/docker-compose.yml down

  mocks:load:
    desc: Load the specs and examples into Microcks (starts the stack if needed)
    run: once
    deps: [mocks:up]
    cmds:
      - curl -sf -F 'file=@specs/openapi.yaml' '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=true'
      - curl -sf -F 'file=@specs/asyncapi.yaml' '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=true'
      - curl -sf -F 'file=@mocks/pizza-lifecycle-events.examples.yaml' '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=false'
      - docker compose -f mocks/docker-compose.yml restart async-minion
      - |
        for i in $(seq 1 30); do
          code=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://localhost:8081/health || true)
          if [ "$code" != "000" ]; then echo "async-minion http up (after $i checks)"; exit 0; fi
          sleep 2
        done
        echo "async-minion not responding after 60s"; exit 1

  mocks:watch:
    desc: Watch the pizza lifecycle event channel (ambient batch every ~30s, plus triggered events)
    cmds:
      - npx -y wscat@6.1.0 -c '{{.WS_URL}}'

  mocks:order:
    desc: 'POST a MakePizza command to the mock (override with TOPPING=your-name)'
    vars:
      TOPPING: '{{.TOPPING | default "mozzarella"}}'
    cmds:
      - |
        curl -s -X POST {{.REST_BASE}}/commands/make-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"size":"small","crust":"deep-pan","toppings":["{{.TOPPING}}"]}' | jq .

  mocks:contract:
    desc: Contract-test the running mocks against the specs they were built from
    run: once
    deps: [mocks:load]
    cmds:
      - task: mocks:contract:run
        vars:
          SERVICE: 'Pizza Service API:1.0.0'
          RUNNER: OPEN_API_SCHEMA
          ENDPOINT: '{{.REST_BASE_INTERNAL}}'
          TIMEOUT: 20000
      - task: mocks:contract:run
        vars:
          SERVICE: 'Pizza Lifecycle Events:1.0.0'
          RUNNER: ASYNC_API_SCHEMA
          ENDPOINT: '{{.WS_URL_INTERNAL}}'
          TIMEOUT: 45000

  mocks:contract:run:
    desc: Run one Microcks test (SERVICE, RUNNER, ENDPOINT, TIMEOUT) and report every exchange
    internal: true
    cmds:
      - |
        echo "contract test: {{.SERVICE}} [{{.RUNNER}}] -> {{.ENDPOINT}}"
        id=$(curl -sf -X POST '{{.MICROCKS_URL}}/api/tests' -H 'Content-Type: application/json' \
          -d '{"serviceId":"{{.SERVICE}}","testEndpoint":"{{.ENDPOINT}}","runnerType":"{{.RUNNER}}","timeout":{{.TIMEOUT}}}' \
          | jq -er '.id') \
          || { echo "could not start the test - is '{{.SERVICE}}' loaded? (task mocks:load)"; exit 1; }
        deadline=$(( $(date +%s) + {{.TIMEOUT}} / 1000 + 60 ))
        while :; do
          result=$(curl -sf '{{.MICROCKS_URL}}/api/tests/'"$id") || { echo "could not read test $id"; exit 1; }
          [ "$(printf %s "$result" | jq -r '.inProgress')" = "true" ] || break
          [ "$(date +%s)" -lt "$deadline" ] || { echo "test $id never finished"; exit 1; }
          sleep 2
        done
        printf %s "$result" | jq -r '.testCaseResults[]
          | "  " + (if .success then "PASS" else "FAIL" end) + "  " + .operationName,
            (.testStepResults[]? | "        " + (if .success then "ok  " else "FAIL " end)
              + (.requestName // "-") + (if .message then " - " + .message else "" end))'
        exchanges=$(printf %s "$result" | jq '[.testCaseResults[].testStepResults[]?] | length')
        [ "$(printf %s "$result" | jq -r '.success')" = "true" ] \
          || { echo "{{.SERVICE}} does not conform to its spec - full detail at {{.MICROCKS_URL}} > Tests"; exit 1; }
        [ "$exchanges" -gt 0 ] \
          || { echo "{{.SERVICE}}: the runner validated nothing - a green test over zero exchanges is a failure"; exit 1; }
        echo "contract ok: {{.SERVICE}} - $exchanges exchanges validated"

  mocks:test:
    desc: Smoke-test the HTTP and event mocks
    cmds:
      - |
        body=$(mktemp)
        code=$(curl -s -o "$body" -w '%{http_code}' -X POST {{.REST_BASE}}/commands/make-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"size":"medium","crust":"sourdough","toppings":["mozzarella","basil"]}')
        [ "$code" = "202" ] || { echo "expected 202, got $code"; exit 1; }
        jq -e .pizzaId "$body"; rm -f "$body"
      - |
        state=$(curl -sf {{.REST_BASE}}/pizzas/{{.FIXTURE_PIZZA_ID}} | jq -r .state)
        [ "$state" = "accepted" ] || { echo "expected accepted, got $state"; exit 1; }
        echo "statusUrl after POST -> $state"
      - |
        for s in accepted:1 topped:2 cooked:3 boxed:4 ready:5 failed:6 cancelled:7; do
          want=${s%%:*}; id=11111111-1111-1111-1111-11111111111${s##*:}
          got=$(curl -sf {{.REST_BASE}}/pizzas/$id | jq -r .state)
          [ "$got" = "$want" ] || { echo "pizza $id: expected $want, got $got"; exit 1; }
          echo "$id -> $got"
        done
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' {{.REST_BASE}}/pizzas/$(uuidgen | tr 'A-Z' 'a-z'))
        [ "$code" = "404" ] || { echo "unknown id: expected 404, got $code"; exit 1; }
        echo "unknown id -> 404"
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST {{.REST_BASE}}/commands/cancel-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"pizzaId":"{{.FIXTURE_PIZZA_ID}}","reason":"smoke"}')
        [ "$code" = "202" ] || { echo "cancel: expected 202, got $code"; exit 1; }
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST {{.REST_BASE}}/commands/cancel-pizza \
          -H 'Content-Type: application/json' -H "Idempotency-Key: $(uuidgen)" \
          -d '{"pizzaId":"11111111-1111-1111-1111-111111111115"}')
        [ "$code" = "409" ] || { echo "cancel terminal: expected 409, got $code"; exit 1; }
        echo "cancel -> 202 / terminal cancel -> 409"
      - |
        node -e "
        const marker = 'trigger-' + Math.random().toString(36).slice(2);
        let tries = 0;
        function connect() {
          const ws = new WebSocket('{{.WS_URL}}');
          ws.onerror = () => {};
          ws.onclose = () => { if (++tries < 10) setTimeout(connect, 2000); else { console.error('WS never connected'); process.exit(1); } };
          ws.onopen = () => {
            ws.onclose = null;
            fetch('{{.REST_BASE}}/commands/make-pizza', { method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Idempotency-Key': crypto.randomUUID() },
              body: JSON.stringify({ size: 'large', crust: 'thin', toppings: ['pepperoni', marker] }) });
          };
          ws.onmessage = e => {
          const ev = JSON.parse(e.data);
          if (ev.type === 'com.hungovercoders.pizza.accepted.v1' && Array.isArray(ev.data.toppings) && ev.data.toppings.includes(marker)) {
            if (ev.specversion !== '1.0') { console.error('not a CloudEvent: ' + e.data); process.exit(1); }
            if (!ev.subject.endsWith('111')) { console.error('triggered event has wrong subject: ' + ev.subject); process.exit(1); }
            if (ev.data.size !== 'large' || ev.data.crust !== 'thin') { console.error('request not echoed'); process.exit(1); }
            console.log('triggered event ok: echoed order on pizza ' + ev.subject); process.exit(0);
          }
          };
        }
        connect();
        setTimeout(() => { console.error('no triggered accepted CloudEvent with marker within 30s'); process.exit(1); }, 30000);
        "
      - |
        node -e "
        let sawFailed = false, count = 0, tries = 0;
        function connect() {
          const ws = new WebSocket('{{.WS_URL}}');
          ws.onerror = () => {};
          ws.onclose = () => { if (++tries < 10) setTimeout(connect, 2000); else { console.error('WS never connected'); process.exit(1); } };
          ws.onopen = () => { ws.onclose = null; };
          ws.onmessage = e => {
            const ev = JSON.parse(e.data); count++;
            if (ev.type === 'com.hungovercoders.pizza.failed.v1') {
              sawFailed = true;
              if (!ev.subject.endsWith('116')) { console.error('failed event on wrong pizza: ' + ev.subject); process.exit(1); }
            }
            if (sawFailed && count >= 7) { console.log('events ok (' + count + ' received, failed on …116)'); process.exit(0); }
          };
        }
        connect();
        setTimeout(() => { console.error('expected 7+ events incl. the failed CloudEvent within 45s, got ' + count); process.exit(1); }, 45000);
        "
